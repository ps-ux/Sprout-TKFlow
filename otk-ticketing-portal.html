// Flattened lookup: full company display name -> { group, entityName, poc }
// entityName is what actually shows on the ticket (the real employing entity).
const COMPANY_LOOKUP = {};
COMPANY_STRUCTURE.forEach(g => {
  if (g.subcompanies.length === 0) {
    COMPANY_LOOKUP[g.group] = { group: g.group, entityName: g.group, poc: g.sharedPoc };
  } else {
    if (!g.isGroupLabelOnly) {
      COMPANY_LOOKUP[g.group] = { group: g.group, entityName: g.group, poc: g.sharedPoc };
    }
    g.subcompanies.forEach(sub => {
      const label = g.isGroupLabelOnly ? `${g.group} — ${sub.name}` : `${g.group} — ${sub.name}`;
      COMPANY_LOOKUP[label] = { group: g.group, entityName: sub.name, poc: sub.poc };
    });
  }
});

// ── Push to TKFlow ───────────────────────────────────────────────────────────
// Sends every status change (and a couple of other real updates) to TKFlow the moment they
// happen — not just once at the end. TKFlow's receive-side logic is receiveTicketUpdate();
// this payload shape matches it exactly. "company" must be TKFlow's real client name
// (e.g. "Kuehne + Nagel, Inc."), not this tool's internal display label — swap in the real
// name for each client when this tool is actually configured per client.
//
// TODO: replace with the real endpoint once the Vercel + Supabase backend exists. Until then
// this will just log a console warning instead of failing silently.
const TKFLOW_PUSH_URL = "https://YOUR-TKFLOW-BACKEND/api/tickets/webhook";

async function pushToTKFlow(ticket) {
  const payload = {
    id: ticket.id,
    employeeName: ticket.employeeName,
    employeeId: ticket.employeeId,
    employeeEmail: ticket.employeeEmail,
    company: ticket.company, // must match a real TKFlow client name exactly
    nature: ticket.nature,
    datesOfDispute: ticket.datesOfDispute,
    dateSubmitted: ticket.dateSubmitted,
    submittedAt: ticket.submittedAt || null, // real timestamp for TAT — falls back to null for older/seed tickets that predate this field
    status: ticket.status,
    assignedTo: ticket.assignedTo,
    details: ticket.details,
  };
  // Payroll Instructions data (captured when a ticket closes) — only sent when it's actually
  // applicable to payroll, matching TKFlow's own piLines shape (code/number/unit/addDed/remarks).
  if (ticket.payrollInstructions && ticket.payrollInstructions.applicable) {
    payload.payrollInstructions = {
      code: ticket.payrollInstructions.disputeType,
      number: ticket.payrollInstructions.number,
      unit: ticket.payrollInstructions.unit,
      addDed: ticket.payrollInstructions.additionDeduction,
      remarks: ticket.payrollInstructions.remarks,
    };
  }
  try {
    await fetch(TKFLOW_PUSH_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  } catch (err) {
    // No real backend to receive this yet — starts working the moment TKFLOW_PUSH_URL
    // points to a real endpoint. Logged so it's visible/testable in the meantime.
    console.warn("TKFlow push not sent (no backend yet):", payload, err);
  }
}

  if (h < 18) return "Good afternoon";
  return "Good evening";
}

function OTKTicketing() {
  const [role, setRole] = useState("employee");
  const [currentCompany, setCurrentCompany] = useState("Solstice Manufacturing"); // POC role can switch this — previously hardcoded, so testing any client besides Solstice wasn't possible
  const [isSubmitting, setIsSubmitting] = useState(false); // guards against a fast double-click creating two tickets with the same generated id
  const [currentEmployee] = useState({ id: "EMP-2201", name: "Carla Santos", email: "carla.santos@solstice.com", company: "Solstice Manufacturing" });
  const [tickets, setTickets] = useState(seedTickets);
  const [view, setView] = useState("list");
  const [selectedTicket, setSelectedTicket] = useState(null);
  const [notifications, setNotifications] = useState([]);
  const [commentDraft, setCommentDraft] = useState("");
  const [commentAttachments, setCommentAttachments] = useState([]);
  const [filterCompany, setFilterCompany] = useState("All");
  const [filterStatus, setFilterStatus] = useState("All");
  const [sortBy, setSortBy] = useState("newest");
  const [payrollPromptTicketId, setPayrollPromptTicketId] = useState(null);

  const STATUS_ORDER = { "Open": 0, "In Progress": 1, "Resolved": 2, "Closed": 3 };

  const [form, setForm] = useState({
    nature: "", datesOfDispute: [""], details: "", attachments: [],
  });

  function pushNotification(to, subject, preview) {
    const id = Date.now() + Math.random();
    setNotifications(n => [...n, { id, to, subject, preview }]);
    setTimeout(() => setNotifications(n => n.filter(x => x.id !== id)), 9000);
  }

  function nextTicketId() {
    const nums = tickets.map(t => parseInt(t.id.split("-")[1], 10));
    return "TK-" + (Math.max(...nums, 1000) + 1);
  }

  function submitTicket(e) {
    e.preventDefault();
    if (isSubmitting) return;
    const cleanDates = form.datesOfDispute.filter(d => d);
    if (!form.nature || cleanDates.length === 0 || !form.details.trim()) return;
    setIsSubmitting(true);
    const id = nextTicketId();
    const newTicket = {
      id,
      employeeId: currentEmployee.id,
      employeeName: currentEmployee.name,
      employeeEmail: currentEmployee.email,
      company: currentEmployee.company,
      nature: form.nature,
      datesOfDispute: cleanDates,
      dateSubmitted: new Date().toISOString().slice(0, 10),
      submittedAt: new Date().toISOString(), // full timestamp, used by TKFlow for real TAT math — dateSubmitted above stays date-only for display/sorting
      details: form.details,
      attachments: form.attachments,
      status: "Open",
      assignedTo: OTK_AGENT.name,
      thread: [],
      employeeConfirmedResolved: false,
      resolvedAt: null,
    };
    setTickets(t => [newTicket, ...t]);
    pushToTKFlow(newTicket);
    setForm({ nature: "", datesOfDispute: [""], details: "", attachments: [] });
    pushNotification(OTK_AGENT.email, `New ticket ${id} — ${form.nature}`, `${currentEmployee.name} from ${currentEmployee.company} just raised a concern. Tap in to take a look.`);
    setView("list");
    setIsSubmitting(false);
  }

  function handleFileChange(e) {
    // Object URLs only work for the lifetime of this browser tab (no real backend to store
    // files in yet) — but that's still enough to let someone actually open what they just
    // attached, instead of it being purely decorative metadata.
    const files = Array.from(e.target.files || []).map(f => ({
      name: f.name,
      type: f.type.includes("pdf") ? "pdf" : "image",
      url: URL.createObjectURL(f),
    }));
    setForm(f => ({ ...f, attachments: [...f.attachments, ...files] }));
  }

  function updateStatus(ticketId, newStatus) {
    const pushTime = new Date().toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    setTickets(ts => ts.map(t => {
      if (t.id !== ticketId) return t;
      const updated = { ...t, status: newStatus, lastPushedAt: pushTime };
      if (newStatus === "Resolved") updated.resolvedAt = new Date().toISOString();
      return updated;
    }));
    const t = tickets.find(t => t.id === ticketId);
    if (t) pushToTKFlow({ ...t, status: newStatus });
    if (t && (newStatus === "Resolved" || newStatus === "In Progress")) {
      pushNotification(t.employeeEmail, `Ticket ${ticketId} update — now ${STATUS_STYLE[newStatus].label}`, `Your OTK agent moved your ticket to "${STATUS_STYLE[newStatus].label}". Open the tool to see the details.`);
    }
    setSelectedTicket(prev => prev && prev.id === ticketId ? { ...prev, status: newStatus, lastPushedAt: pushTime, resolvedAt: newStatus === "Resolved" ? new Date().toISOString() : prev.resolvedAt } : prev);
    if (newStatus === "Closed") setPayrollPromptTicketId(ticketId);
  }

  function savePayrollInstructions(ticketId, data) {
    setTickets(ts => ts.map(t => t.id === ticketId ? { ...t, payrollInstructions: data } : t));
    setSelectedTicket(prev => prev && prev.id === ticketId ? { ...prev, payrollInstructions: data } : prev);
    setPayrollPromptTicketId(null);
    const t = tickets.find(t => t.id === ticketId);
    if (t) pushToTKFlow({ ...t, payrollInstructions: data });
  }

  function confirmResolutionAndClose(ticketId) {
    const t = tickets.find(t => t.id === ticketId);
    setTickets(ts => ts.map(t => t.id === ticketId ? { ...t, status: "Closed", employeeConfirmedResolved: true } : t));
    setSelectedTicket(prev => prev && prev.id === ticketId ? { ...prev, status: "Closed", employeeConfirmedResolved: true } : prev);
    if (t) pushToTKFlow({ ...t, status: "Closed" });
    // Same reminder updateStatus() already gives when an OTK agent closes a ticket directly —
    // previously this, the actual common closure path (employee confirms), skipped it entirely.
    setPayrollPromptTicketId(ticketId);
  }

  function postComment(ticket, files) {
    if (!commentDraft.trim() && (!files || files.length === 0)) return;
    const mentions = [];
    // Mentionable people for THIS ticket's thread — the actual employee who filed it, the
    // OTK agent, and whichever POC really owns this ticket's company. Previously this was
    // hardcoded to two specific demo names (Bea Ramos, Miguel Tan), so mentioning any of the
    // other 5 real POCs across Kuehne Nagel / HDI silently did nothing.
    const ticketPoc = POC_BY_COMPANY[ticket.company];
    const mentionable = [ticket.employeeName, OTK_AGENT.name, ticketPoc && ticketPoc.name].filter(Boolean);
    mentionable.forEach(name => {
      if (commentDraft.includes("@" + name)) mentions.push(name);
    });
    const authorName = role === "otk" ? OTK_AGENT.name : role === "poc" ? POC_BY_COMPANY[ticket.company].name : currentEmployee.name;
    const authorRole = role;
    const attachments = (files || []).map(f => ({ name: f.name, type: f.type.includes("pdf") ? "pdf" : "image", url: URL.createObjectURL(f) }));
    const newEntry = { author: authorName, role: authorRole, text: commentDraft, time: "Just now", mentions, attachments };
    const autoProgressesNow = authorRole === "otk" && ticket.status === "Open";
    setTickets(ts => ts.map(t => {
      if (t.id !== ticket.id) return t;
      const shouldAutoProgress = authorRole === "otk" && t.status === "Open";
      return {
        ...t,
        thread: [...t.thread, newEntry],
        status: shouldAutoProgress ? "In Progress" : t.status,
        lastPushedAt: shouldAutoProgress ? new Date().toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : t.lastPushedAt,
      };
    }));
    if (autoProgressesNow) pushToTKFlow({ ...ticket, status: "In Progress" });
    setSelectedTicket(prev => {
      if (!prev || prev.id !== ticket.id) return prev;
      const shouldAutoProgress = authorRole === "otk" && prev.status === "Open";
      return {
        ...prev,
        thread: [...prev.thread, newEntry],
        status: shouldAutoProgress ? "In Progress" : prev.status,
      };
    });

    mentions.forEach(m => {
      let email = null;
      if (m === OTK_AGENT.name) email = OTK_AGENT.email;
      else if (m === ticket.employeeName) email = ticket.employeeEmail; // this ticket's own employee, not necessarily whoever's currently logged in
      else { const poc = Object.values(POC_BY_COMPANY).find(p => p.name === m); if (poc) email = poc.email; }
      if (email) pushNotification(email, `You were mentioned on ${ticket.id}`, `${authorName} tagged you in the ticket thread: "${commentDraft.slice(0, 60)}${commentDraft.length > 60 ? "…" : ""}"`);
    });
    if (authorRole !== "employee") {
      pushNotification(ticket.employeeEmail, `New reply on your ticket ${ticket.id}`, `${authorName}: "${commentDraft.slice(0, 70)}${commentDraft.length > 70 ? "…" : ""}"`);
    }
    if (authorRole === "otk" && ticket.status === "Open") {
      pushNotification(ticket.employeeEmail, `Ticket ${ticket.id} update — now In Progress`, `Your OTK agent has started looking into this.`);
    }
    setCommentDraft("");
    setCommentAttachments([]);
  }

  const visibleTickets = useMemo(() => {
    let list = tickets;
    if (role === "employee") list = list.filter(t => t.employeeId === currentEmployee.id);
    if (role === "poc") list = list.filter(t => t.company === currentCompany);
    if (role === "otk") {
      if (filterCompany !== "All") list = list.filter(t => t.company === filterCompany);
      if (filterStatus !== "All") list = list.filter(t => t.status === filterStatus);
    }
    list = [...list];
    if (sortBy === "status") {
      list.sort((a, b) => STATUS_ORDER[a.status] - STATUS_ORDER[b.status]);
    } else if (sortBy === "oldest") {
      list.sort((a, b) => a.dateSubmitted.localeCompare(b.dateSubmitted));
    } else {
      list.sort((a, b) => b.dateSubmitted.localeCompare(a.dateSubmitted));
    }
    return list;
  }, [tickets, role, currentCompany, currentEmployee.id, filterCompany, filterStatus, sortBy]);

  const daysSinceResolved = (t) => {
    if (!t.resolvedAt) return null;
    return Math.floor((Date.now() - new Date(t.resolvedAt).getTime()) / 86400000);
  };

  // Attachments hold an object URL for the life of this tab so they can actually be opened —
  // revoked here on unmount as a safety net against unbounded memory growth over a long
  // single session, since there's no real backend to hand file storage off to yet.
  useEffect(() => {
    return () => {
      tickets.forEach(t => (t.attachments || []).forEach(a => a.url && URL.revokeObjectURL(a.url)));
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Enforces the "auto-closes after 7 days" behavior the FAQ and the countdown UI both
  // promise — previously nothing actually did this, so a Resolved ticket the employee never
  // confirmed would just sit there forever. Checks once on load, then hourly.
  useEffect(() => {
    function checkAutoClose() {
      const toClose = tickets.filter(t => {
        if (t.status !== "Resolved" || !t.resolvedAt) return false;
        const days = Math.floor((Date.now() - new Date(t.resolvedAt).getTime()) / 86400000);
        return days >= 7;
      });
      if (toClose.length === 0) return;
      setTickets(ts => ts.map(t => toClose.some(c => c.id === t.id) ? { ...t, status: "Closed", employeeConfirmedResolved: false, autoClosed: true } : t));
      toClose.forEach(t => pushToTKFlow({ ...t, status: "Closed" }));
      setPayrollPromptTicketId(toClose[toClose.length - 1].id);
    }
    checkAutoClose();
    const interval = setInterval(checkAutoClose, 60 * 60 * 1000);
    return () => clearInterval(interval);
  }, [tickets]);

                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      <div style={{ maxWidth: 880, margin: "0 auto", padding: "20px 20px 28px", width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, borderTop: "1px solid #ECEAF7", boxSizing: "border-box" }}>
        <span style={{ fontSize: 12, color: BRAND.textMuted }}>© 2026 Sprout Solutions</span>
        <button onClick={() => { setView(view === "faq" ? "list" : "faq"); setSelectedTicket(null); }}
          style={{ background: "none", border: "none", color: BRAND.ubas, fontWeight: 600, fontSize: 12.5, padding: 0 }}>
          FAQs
        </button>
      </div>

      {selectedTicket && (
        <TicketDetail
          ticket={tickets.find(t => t.id === selectedTicket.id) || selectedTicket}
          role={role}
          onClose={() => { setSelectedTicket(null); setCommentDraft(""); }}
          onStatusChange={updateStatus}
          onConfirmClose={confirmResolutionAndClose}
          commentDraft={commentDraft}
          setCommentDraft={setCommentDraft}
          commentAttachments={commentAttachments}
          setCommentAttachments={setCommentAttachments}
          onPostComment={postComment}
          daysSinceResolved={daysSinceResolved}
          onOpenPayrollPrompt={(id) => setPayrollPromptTicketId(id)}
        />
      )}

      {payrollPromptTicketId && role === "otk" && (
        <PayrollInstructionsModal
          ticket={tickets.find(t => t.id === payrollPromptTicketId)}
          onSave={(data) => savePayrollInstructions(payrollPromptTicketId, data)}
          onSkip={() => setPayrollPromptTicketId(null)}
        />
      )}
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontSize: 12.5, fontWeight: 600, color: "#5F5E5A", marginBottom: 6 }}>{label}</div>
      {children}
    </div>
  );
}

function inputStyle(disabled) {
  return {
    width: "100%", padding: "10px 12px", borderRadius: 10, border: "1px solid #D8D5EE",
    fontSize: 14, background: disabled ? "#F7F5F2" : "#fff", color: disabled ? "#8a8a9a" : "#1a1a2e",
  };
}

function AttachmentChip({ file }) {
  const chipStyle = { display: "flex", alignItems: "center", gap: 6, background: "#F1EFE8", borderRadius: 8, padding: "5px 10px", fontSize: 12.5 };
  const inner = (
    <>
      <span>{file.type === "pdf" ? "📄" : "🖼️"}</span>
      <span style={file.url ? { textDecoration: "underline", color: BRAND.ubas } : undefined}>{file.name}</span>
    </>
  );
  // Only real, freshly-attached files (this session) have a usable url — older/seed
  // attachments predate real file capture and just render as plain, non-clickable metadata.
  return file.url ? (
    <a href={file.url} target="_blank" rel="noopener noreferrer" style={{ ...chipStyle, textDecoration: "none", cursor: "pointer" }}>{inner}</a>
  ) : (
    <div style={chipStyle}>{inner}</div>
  );
}

function TicketDetail({ ticket, role, onClose, onStatusChange, onConfirmClose, commentDraft, setCommentDraft, commentAttachments, setCommentAttachments, onPostComment, daysSinceResolved, onOpenPayrollPrompt }) {
  const poc = POC_BY_COMPANY[ticket.company];
  const days = daysSinceResolved(ticket);
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(44,44,42,0.4)", display: "flex", justifyContent: "flex-end", zIndex: 60 }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ width: "min(520px, 100%)", background: BRAND.n1, height: "100%", overflowY: "auto", padding: "24px 26px", boxShadow: "-8px 0 24px rgba(0,0,0,0.08)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18 }}>
          <div>
            <div style={{ fontSize: 12, color: BRAND.textMuted, fontWeight: 600 }}>{ticket.id}</div>
            <div className="heading" style={{ fontSize: 19, fontWeight: 700 }}>{ticket.nature}</div>
          </div>
          <button onClick={onClose} style={{ border: "none", background: "#fff", borderRadius: 10, width: 32, height: 32, fontSize: 15 }}>✕</button>
        </div>

        <div style={{ background: "#fff", borderRadius: 14, padding: "16px 18px", marginBottom: 16, border: "1px solid #ECEAF7" }}>
          <StatusBadge status={ticket.status} />
          <div style={{ marginTop: 12, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, fontSize: 13 }}>
            <div><div style={detailLabel}>Employee</div>{ticket.employeeName} ({ticket.employeeId})</div>
            <div><div style={detailLabel}>Company</div>{ticket.company}</div>
            <div><div style={detailLabel}>Date(s) of dispute</div>{ticket.datesOfDispute.join(", ")}</div>
            <div><div style={detailLabel}>Submitted</div>{ticket.dateSubmitted}</div>
          </div>
          <div style={{ marginTop: 12 }}>
            <div style={detailLabel}>Details</div>
            <div style={{ fontSize: 13.5, lineHeight: 1.5 }}>{ticket.details}</div>
          </div>
          {ticket.attachments.length > 0 && (
            <div style={{ marginTop: 12 }}>
              <div style={detailLabel}>Attachments</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {ticket.attachments.map((a, i) => <AttachmentChip key={i} file={a} />)}
              </div>
            </div>
          )}
        </div>

        {role === "otk" && (
          <div style={{ background: "#fff", borderRadius: 14, padding: "14px 18px", marginBottom: 16, border: "1px solid #ECEAF7" }}>
            <div style={detailLabel}>Update status</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: ticket.lastPushedAt ? 10 : 0 }}>
              {/* "Closed" is deliberately excluded here — per the FAQ, closing only happens
                  via employee confirmation or the 7-day auto-close, never a direct OTK click.
                  Letting OTK force-close bypassed that entirely. */}
              {Object.keys(STATUS_STYLE).filter(s => s !== "Closed").map(s => (
                <button key={s} onClick={() => onStatusChange(ticket.id, s)}
                  style={{ padding: "7px 12px", borderRadius: 9, border: ticket.status === s ? `1.5px solid ${BRAND.ubas}` : "1px solid #D8D5EE", background: ticket.status === s ? BRAND.n5 : "#fff", fontSize: 12.5, fontWeight: 600 }}>
                  {STATUS_STYLE[s].label}
                </button>
              ))}
            </div>
            {ticket.lastPushedAt && (
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#1f7a0a" }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: BRAND.greenApple, display: "inline-block" }} />
                Pushed to TKFlow · {ticket.lastPushedAt}
              </div>
            )}
          </div>
        )}

        {role === "otk" && ticket.status === "Closed" && (
          <div style={{ background: ticket.payrollInstructions ? BRAND.n2 : "#fff", borderRadius: 14, padding: "14px 18px", marginBottom: 16, border: "1px solid #ECEAF7" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={detailLabel}>Payroll instructions</div>
              <button onClick={() => onOpenPayrollPrompt(ticket.id)} style={{ background: "none", border: "none", color: BRAND.ubas, fontWeight: 600, fontSize: 12, padding: 0 }}>
                {ticket.payrollInstructions ? "Edit" : "+ Add"}
              </button>
            </div>
            {ticket.payrollInstructions ? (
              ticket.payrollInstructions.applicable ? (
                <div style={{ fontSize: 13, marginTop: 6 }}>
                  <div><strong>{ticket.payrollInstructions.disputeType}</strong> · {ticket.payrollInstructions.number} {ticket.payrollInstructions.unit} · {ticket.payrollInstructions.additionDeduction}</div>
                  <div style={{ color: BRAND.textSecondary, marginTop: 4 }}>{ticket.payrollInstructions.remarks}</div>
                </div>
              ) : (
                <div style={{ fontSize: 13, color: BRAND.textMuted, marginTop: 6 }}>Marked as not applicable to payroll.</div>
              )
            ) : (
              <div style={{ fontSize: 13, color: BRAND.textMuted, marginTop: 6 }}>Not yet indicated — click "Add" to note if this needs to be pushed to TKFlow's disputes tab.</div>
            )}
          </div>
        )}

        {role === "employee" && ticket.status === "Resolved" && !ticket.employeeConfirmedResolved && (
          <div style={{ background: BRAND.n4, borderRadius: 14, padding: "14px 18px", marginBottom: 16 }}>
            <div style={{ fontSize: 13.5, fontWeight: 700, color: BRAND.deepGreen, marginBottom: 4 }}>Marked as resolved</div>
            <div style={{ fontSize: 12.5, color: "#1f5c0a", marginBottom: 10 }}>
              Does this look good to you? If we don't hear back, this closes automatically in {Math.max(7 - (days || 0), 0)} day(s).
            </div>
            <button onClick={() => onConfirmClose(ticket.id)} style={{ background: BRAND.greenApple, color: "#fff", border: "none", padding: "9px 16px", borderRadius: 10, fontWeight: 700, fontSize: 13 }}>
              Confirm and close
            </button>
          </div>
        )}

        <div style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 13.5, fontWeight: 700, marginBottom: 10 }}>Conversation</div>
          {ticket.thread.length === 0 && <div style={{ fontSize: 13, color: "#888780" }}>No messages yet.</div>}
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {ticket.thread.map((m, i) => (
              <div key={i} style={{ display: "flex", gap: 10 }}>
                <Avatar name={m.author} tone={m.role === "otk" ? BRAND.n4 : m.role === "poc" ? "#fff0e0" : BRAND.n5} textColor={m.role === "otk" ? "#1f7a0a" : m.role === "poc" ? "#a35700" : BRAND.ubas} />
                <div style={{ background: "#fff", borderRadius: 12, padding: "9px 13px", flex: 1, border: "1px solid #ECEAF7" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, color: BRAND.textMuted, marginBottom: 3 }}>
                    <span style={{ fontWeight: 700, color: BRAND.textPrimary }}>{m.author}</span>
                    <span>{m.time}</span>
                  </div>
                  <div style={{ fontSize: 13, lineHeight: 1.5 }}>{m.text}</div>
                  {m.attachments && m.attachments.length > 0 && (
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 6 }}>
                      {m.attachments.map((a, ai) => <AttachmentChip key={ai} file={a} />)}
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ background: "#fff", borderRadius: 14, padding: 12, border: "1px solid #ECEAF7" }}>
          <textarea rows={2} placeholder={`Write a reply… try @${poc.name.split(" ")[0]} to loop in the client POC`}
            value={commentDraft} onChange={e => setCommentDraft(e.target.value)}
            style={{ width: "100%", border: "none", resize: "none", fontSize: 13, outline: "none", fontFamily: "inherit" }} />
          {commentAttachments.length > 0 && (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", margin: "6px 0" }}>
              {commentAttachments.map((f, i) => <AttachmentChip key={i} file={{ name: f.name, type: f.type.includes("pdf") ? "pdf" : "image" }} />)}
            </div>
          )}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <label style={{ fontSize: 12.5, color: BRAND.ubas, fontWeight: 600, cursor: "pointer" }}>
              + Attach file
              <input type="file" accept="image/*,application/pdf" multiple style={{ display: "none" }}
                onChange={e => setCommentAttachments(prev => [...prev, ...Array.from(e.target.files || [])])} />
            </label>
            <button onClick={() => onPostComment(ticket, commentAttachments)} style={{ background: BRAND.ubas, color: "#fff", border: "none", padding: "8px 16px", borderRadius: 9, fontWeight: 700, fontSize: 12.5 }}>Reply</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function FAQPage({ onBack }) {
  const [open, setOpen] = useState(null);
  return (
    <div>
      <button onClick={onBack} style={{ background: "none", border: "none", color: BRAND.ubas, fontWeight: 600, fontSize: 13, marginBottom: 14, padding: 0 }}>← Back to my tickets</button>
      <div className="heading" style={{ fontSize: 21, fontWeight: 700, marginBottom: 4 }}>Frequently asked questions</div>
      <div style={{ color: BRAND.textSecondary, fontSize: 14, marginBottom: 20 }}>A quick rundown before you raise a ticket.</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {FAQS.map((f, i) => (
          <div key={i} style={{ background: "#fff", border: "1px solid #ECEAF7", borderRadius: 14, overflow: "hidden" }}>
            <button onClick={() => setOpen(open === i ? null : i)}
              style={{ width: "100%", textAlign: "left", background: "none", border: "none", padding: "14px 18px", display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 14, fontWeight: 600, color: BRAND.textPrimary }}>
              {f.q}
              <span style={{ color: BRAND.ubas, fontSize: 16 }}>{open === i ? "−" : "+"}</span>
            </button>
            {open === i && (
              <div style={{ padding: "0 18px 16px", fontSize: 13.5, color: BRAND.textSecondary, lineHeight: 1.6 }}>{f.a}</div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

const OT_RD_ABSENT_OPTIONS = [
  "Absent", "Undertime",
  "Ord-OT", "Ord-ND", "Ord-ND-OT",
  "RD", "RD-OT", "RD-ND", "RD-ND-OT",
  "SH", "SH-OT", "SH-ND", "SH-ND-OT",
  "LH", "LH-OT", "LH-ND", "LH-ND-OT",
  "SH-RD", "SH-RD-OT", "SH-RD-ND", "SH-RD-ND-OT",
  "LH-RD", "LH-RD-OT", "LH-RD-ND", "LH-RD-ND-OT",
  "DH", "DH-OT", "DH-ND", "DH-ND-OT",
  "DH-RD", "DH-RD-OT", "DH-RD-ND", "DH-RD-ND-OT",
];

function unitForDisputeType(type) {
  if (type === "Absent") return "Days";
  if (type === "Undertime") return "Mins";
  return "Hrs";
}

function PayrollInstructionsModal({ ticket, onSave, onSkip }) {
  const [applicable, setApplicable] = useState(true);
  const [disputeType, setDisputeType] = useState("Absent");
  const [number, setNumber] = useState("");
  const [additionDeduction, setAdditionDeduction] = useState("Addition");
  const [remarks, setRemarks] = useState("");
  const unit = unitForDisputeType(disputeType);

  function submit() {
    onSave({
      applicable,
      ticketNo: ticket?.id,
      employeeId: ticket?.employeeId,
      employeeName: ticket?.employeeName,
      disputeType,
      number,
      unit,
      additionDeduction,
      remarks,
    });
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(26,26,46,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 80, padding: 20 }}>
      <div style={{ background: "#fff", borderRadius: 18, padding: "24px 26px", width: "min(460px, 100%)", maxHeight: "90vh", overflowY: "auto" }}>
        <div className="heading" style={{ fontSize: 17, fontWeight: 700, marginBottom: 4 }}>Payroll instructions for {ticket?.id}</div>
        <div style={{ fontSize: 13, color: "#4a4a6a", marginBottom: 16 }}>
          This ticket is now closed. Let us know if it needs to be noted for payroll — this pushes straight into TKFlow's disputes tab when it syncs.
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          <button onClick={() => setApplicable(true)}
            style={{ flex: 1, padding: "9px 12px", borderRadius: 10, border: applicable ? `1.5px solid ${BRAND.ubas}` : "1px solid #D8D5EE", background: applicable ? BRAND.n5 : "#fff", fontWeight: 600, fontSize: 13 }}>
            Yes, applicable
          </button>
          <button onClick={() => setApplicable(false)}
            style={{ flex: 1, padding: "9px 12px", borderRadius: 10, border: !applicable ? `1.5px solid ${BRAND.ubas}` : "1px solid #D8D5EE", background: !applicable ? BRAND.n5 : "#fff", fontWeight: 600, fontSize: 13 }}>
            Not applicable
          </button>
        </div>

        {applicable && (
          <>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 4 }}>
              <Field label="Ticket #"><input disabled value={ticket?.id || ""} style={inputStyle(true)} /></Field>
              <Field label="Employee ID"><input disabled value={ticket?.employeeId || ""} style={inputStyle(true)} /></Field>
            </div>
            <Field label="Employee name"><input disabled value={ticket?.employeeName || ""} style={inputStyle(true)} /></Field>

            <Field label="Dispute details (OT, RD, Absent, etc.)">
              <select value={disputeType} onChange={e => setDisputeType(e.target.value)} style={inputStyle()}>
                {OT_RD_ABSENT_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
              </select>
            </Field>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <Field label="Number">
                <input type="number" step="0.01" placeholder="e.g. 1.00" value={number} onChange={e => setNumber(e.target.value)} style={inputStyle()} />
              </Field>
              <Field label="Unit (auto)">
                <input disabled value={unit} style={inputStyle(true)} />
              </Field>
            </div>

            <Field label="Addition or deduction">
              <div style={{ display: "flex", gap: 8 }}>
                {["Addition", "Deduction"].map(o => (
                  <button key={o} type="button" onClick={() => setAdditionDeduction(o)}
                    style={{ flex: 1, padding: "9px 12px", borderRadius: 9, border: additionDeduction === o ? `1.5px solid ${BRAND.ubas}` : "1px solid #D8D5EE", background: additionDeduction === o ? BRAND.n5 : "#fff", fontWeight: 600, fontSize: 13 }}>
                    {o}
                  </button>
                ))}
              </div>
            </Field>

            <Field label="Remarks">
              <textarea rows={2} placeholder='e.g. "Payroll deduction due to absence in June 13. Requested for reversal."' value={remarks} onChange={e => setRemarks(e.target.value)} style={{ ...inputStyle(), resize: "vertical" }} />
            </Field>
          </>
        )}

        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 16 }}>
          <button onClick={onSkip} style={{ background: "none", border: "none", color: BRAND.textSecondary, fontWeight: 600, fontSize: 13 }}>Skip for now</button>
          <button onClick={submit} style={{ background: BRAND.ubas, color: "#fff", border: "none", padding: "10px 20px", borderRadius: 10, fontWeight: 700, fontSize: 13.5 }}>Save</button>
        </div>
      </div>
    </div>
  );
}

const detailLabel = { fontSize: 11, textTransform: "uppercase", letterSpacing: 0.3, color: "#888780", marginBottom: 3, fontWeight: 700 };

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<OTKTicketing />);
</script>
</body>
</html>
